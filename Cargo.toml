[workspace]
members = ["crates/chem_sim", "crates/bevy_replicon_renet2_patched"]

[package]
name = "chemgame"
version = "0.1.0"
edition = "2021"
default-run = "chemgame"

[dependencies]
chem_sim = { path = "crates/chem_sim" }
bevy = { version = "0.19", features = ["serialize"] }
# Bevy's accessibility component intentionally does not re-export AccessKit's
# node builder. This is the exact version Bevy already links; declaring it
# directly lets icon-only controls carry real screen-reader labels without
# adding another copy to the binary.
accesskit = "0.24"
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
ron = "0.11"
# Also reads the authored training layout in fallback builds.
quake-map = "0.6"
sha2 = "0.10"
aes-gcm-siv = "0.11"
zstd = "0.13"
bevy_replicon = "0.42.0"
bevy_replicon_renet = "0.18.0"
# Locally patched — see crates/bevy_replicon_renet2_patched/PATCH_NOTES.md.
# Only the Steam transport (net/steam.rs) uses this; the LAN/dev path above
# is untouched. netcode/default features stay off to avoid pulling in a
# second, unused copy of the netcode transport.
bevy_replicon_renet2 = { path = "crates/bevy_replicon_renet2_patched", default-features = false, features = [
    "steam",
    "client",
    "server",
] }
# Published under a hyphenated crate name; imports as `bevy_steamworks` in code.
bevy-steamworks = "0.17.0"
# `bevy_replicon_renet2` re-exports renet2's own core (`RenetServer`,
# `ConnectionConfig`, ...) under its `renet2` module, but not the
# steam-specific transport types (`SteamServerTransport` and friends) —
# those only live in `bevy_renet2::steam`, so this is a direct dependency
# too, pinned to the exact version the patched crate already depends on.
bevy_renet2 = { version = "0.16.0", default-features = false, features = [
    "steam",
] }
# The station is authored in TrenchBroom. The dependency remains optional so
# `--no-default-features` can still build the compact const-table fallback.
bevy_trenchbroom = { version = "0.14.0", optional = true }

[features]
# Shipping builds load `assets/maps/lab.map`; the old const-table lab remains a
# deliberately supported fallback for headless/minimal builds.
default = ["trenchbroom"]
trenchbroom = ["dep:bevy_trenchbroom"]
# Links bevy dynamically, which cuts iteration builds down a lot. Off by
# default because it needs the shared library alongside the binary, so it is
# not suitable for shipping: `cargo run --features fast-compile`.
fast-compile = ["bevy/dynamic_linking"]
# Steam builds replace Bevy's loose-file asset reader with the authenticated
# pack reader. Development remains loose-file by default.
packed-assets = []

# Bevy is unusably slow to iterate on without this: dependencies get optimised
# even in debug builds, while our own crates stay fast to recompile.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
ron = "0.11"
# The same parser `bevy_trenchbroom` loads maps with, pinned to the version it
# depends on, so `lab::tb_map` validates the map against the real thing rather
# than against our own idea of the format.
quake-map = "0.6"
# `bevy_replicon`'s actual wire encoding — pinned to the version it already
# depends on. Only for tests that need to prove a type survives postcard
# specifically, not just RON: postcard is not self-describing, so a
# hand-written `Deserialize` that only round-trips through RON's forgiveness
# (`#[serde(default)]` et al.) can still panic-buffer-underrun over the wire.
# See `arc::tests::campaign_roster_round_trips_through_the_actual_wire_format`.
postcard = { version = "1.1", features = ["alloc"] }

[profile.dev]
opt-level = 1

# Untuned by default: LTO/codegen-units/strip all trade compile time for a
# smaller, faster shipped binary — worth paying for a release build, not for
# dev iteration (which stays on [profile.dev] above).
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 2
