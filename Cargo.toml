[workspace]
members = ["crates/chem_sim"]

[package]
name = "chemgame"
version = "0.1.0"
edition = "2021"

[dependencies]
chem_sim = { path = "crates/chem_sim" }
ron = "0.8"

# Bevy arrives in M2. Keeping it out until then keeps the M1 test loop fast.

# Bevy is unusably slow to iterate on without this: dependencies get optimised
# even in debug builds, while our own crates stay fast to recompile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
