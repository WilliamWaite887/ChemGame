[workspace]
members = ["crates/chem_sim"]

[package]
name = "chemgame"
version = "0.1.0"
edition = "2021"

[dependencies]
chem_sim = { path = "crates/chem_sim" }
bevy = "0.19"
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"

[features]
# Links bevy dynamically, which cuts iteration builds down a lot. Off by
# default because it needs the shared library alongside the binary, so it is
# not suitable for shipping: `cargo run --features fast-compile`.
fast-compile = ["bevy/dynamic_linking"]

# Bevy is unusably slow to iterate on without this: dependencies get optimised
# even in debug builds, while our own crates stay fast to recompile.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
ron = "0.11"

[profile.dev]
opt-level = 1
