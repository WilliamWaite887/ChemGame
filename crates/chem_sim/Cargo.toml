[package]
name = "chem_sim"
version = "0.1.0"
edition = "2021"

# Deliberately no bevy dependency. This crate is the heart of the game: keeping
# it engine-free means it is testable in milliseconds without spinning up an
# App, and a dedicated server can run it with no renderer.
[dependencies]
serde = { version = "1", features = ["derive"] }
# Kept in step with the version bevy_common_assets uses, so the game and the
# tests parse the data files with exactly the same parser.
ron = "0.11"

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
